name: Bug report
description: Something in Item Rarities is wrong, broken or crashed the game.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. The more of this you fill in, the faster it can be fixed.
        One bug per report, please. Check the [open issues](https://github.com/Deaadman/item-rarities/issues) first, in case it's already there.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and any error you saw.
      placeholder: The rarity label stays on screen after I close the crafting menu.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: The label goes away with the menu.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from loading a save, and which settings you have on. How often it happens. A short video helps.
      placeholder: |
        1. Load a save and open the crafting menu
        2. Select an arrow
        3. Close the menu

  - type: dropdown
    id: where
    attributes:
      label: Which part of the mod
      multiple: true
      options:
        - An item's rarity is wrong or missing
        - Rarity labels
        - Colours in the inventory, containers or clothing
        - Sorting by rarity
        - The radial menu or inspect view
        - Custom colours in the settings
        - Translations
        - Items from other mods
        - The game crashed or wouldn't load
        - Something else
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Item Rarities version
      description: The console window that opens with the game shows it when the mod loads, like 2.1.0 or 2.1.0-nightly.20261022+g1a2b3c4.
      placeholder: 2.1.0
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: The Long Dark version
      description: Shown at the bottom of the game's main menu.
      placeholder: "2.55"
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Your other mods
      description: Everything in your game's Mods folder. If you can, check whether it still happens with only Item Rarities and its dependencies.

  - type: textarea
    id: log
    attributes:
      label: MelonLoader log
      description: |
        First turn on every logging level in Complex Logger's options, in the game's Mod Settings menu, then make the bug happen again.
        Close the game, then drag `MelonLoader\Latest.log` from your game's folder into this box. Please attach the file rather than a screenshot of the console.
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, a video, or anything else that might help.
