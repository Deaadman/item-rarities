name: Feature request
description: An idea for something Item Rarities could do, or do better.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [open issues](https://github.com/Deaadman/item-rarities/issues) first, in case someone has already suggested it.

  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The moment in the game where something gets in your way. Start from your game, not the feature.
      placeholder: When I sort a container by rarity, I can't tell which items came from the container.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What the mod could do about it.
      placeholder: Keep the container's items and mine apart when sorting by rarity.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the mod
      multiple: true
      options:
        - Which rarity an item has
        - Rarity labels
        - Colours in the inventory, containers or clothing
        - Sorting by rarity
        - Settings
        - Translations
        - Support for other mods
        - Something the mod doesn't touch yet
